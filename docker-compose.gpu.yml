name: aasp-gpu

services:
  qwen:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    command:
      - --model
      - ${QWEN_MODEL:-Qwen/Qwen3.8-27B}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --api-key
      - ${QWEN_API_KEY:?Set a strong runtime QWEN_API_KEY}
      - --dtype
      - ${QWEN_DTYPE:-auto}
      - --tensor-parallel-size
      - ${QWEN_TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${QWEN_GPU_MEMORY_UTILIZATION:-0.88}
      - --max-model-len
      - ${QWEN_MAX_MODEL_LEN:-8192}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - qwen-cache:/root/.cache/huggingface
    expose: ["8000"]
    ports:
      - "${QWEN_BIND_ADDRESS:-127.0.0.1}:${QWEN_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m
    networks: [private]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

volumes:
  qwen-cache:

networks:
  private:
    name: aasp-private
    external: true
