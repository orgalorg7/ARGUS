name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: argus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PLATFORM_IMAGE: ghcr.io/orgalorg7/argus-platform

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: aasp
          POSTGRES_USER: aasp
          POSTGRES_PASSWORD: ci-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aasp -d aasp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations to PostgreSQL 17
        env:
          DATABASE_URL: postgresql://aasp:ci-migration-password@127.0.0.1:5432/aasp?schema=public
        run: pnpm prisma:migrate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit, integration, and security tests
        run: pnpm test

      - name: Build all packages and applications
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Validate CPU Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password-not-used
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: ci-admin-password-not-used
          MODEL_PROVIDER_ENCRYPTION_KEY: Y2ktbW9kZWwtcHJvdmlkZXItZW5jcnlwdGlvbi1rZXk=
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password-not-used
          JWT_SECRET: ci-jwt-secret-with-at-least-thirty-two-characters
          ADMIN_PASSWORD: ci-admin-password-not-used
          MODEL_PROVIDER_ENCRYPTION_KEY: Y2ktbW9kZWwtcHJvdmlkZXItZW5jcnlwdGlvbi1rZXk=
          ARGUS_PLATFORM_IMAGE: ghcr.io/orgalorg7/argus-platform:sha-ci-validation
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          upload: ${{ vars.CODEQL_UPLOAD_ENABLED == 'true' && 'always' || 'never' }}
          upload-database: false

  container:
    name: Build and publish platform image
    needs: [quality, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.PLATFORM_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and conditionally publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.platform
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Export immutable deployment reference
        id: image
        shell: bash
        run: echo "reference=${PLATFORM_IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: [container]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_REFERENCE: ${{ needs.container.outputs.image }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing production secret: $name" >&2; exit 1; }
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Transfer immutable deployment definition
        shell: bash
        run: |
          port=${DEPLOY_PORT:-22}
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -P "$port" \
            docker-compose.yml \
            docker-compose.production.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -P "$port" scripts/deploy-production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/"

      - name: Deploy and wait for health checks
        shell: bash
        run: |
          port=${DEPLOY_PORT:-22}
          printf '%s' "$GHCR_TOKEN" | ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod 700 scripts/deploy-production.sh && ARGUS_PLATFORM_IMAGE='$IMAGE_REFERENCE' bash scripts/deploy-production.sh"
