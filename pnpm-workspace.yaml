packages:
  - apps/*
  - packages/*
  - services/*
  - fixtures/*

overrides:
  deepmerge-ts: 8.0.2
  multer: 2.3.0
  path-to-regexp: 8.4.2

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
