name: aasp

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: aasp
      POSTGRES_USER: aasp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aasp_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aasp -d aasp"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped

  redis:
    image: redis:8.2.1-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    command:
      ["sh", "-c", "pnpm prisma:migrate && pnpm prisma:seed && pnpm --filter @aasp/api start"]
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://aasp:${POSTGRES_PASSWORD:-aasp_dev_only}@postgres:5432/aasp?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to at least 16 characters}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      QWEN_PROVIDER_ALLOWED_HOSTS: ${QWEN_PROVIDER_ALLOWED_HOSTS:-qwen,localhost,127.0.0.1}
      MODEL_PROVIDER_ENCRYPTION_KEY: ${MODEL_PROVIDER_ENCRYPTION_KEY:-}
      REPORTS_ROOT: /app/reports
    volumes:
      - reports-data:/app/reports
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    command: ["pnpm", "--filter", "@aasp/worker", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aasp:${POSTGRES_PASSWORD:-aasp_dev_only}@postgres:5432/aasp?schema=public
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen/Qwen3.8-27B}
      MODEL_PROVIDER_ENCRYPTION_KEY: ${MODEL_PROVIDER_ENCRYPTION_KEY:-}
      REPORTS_ROOT: /app/reports
    volumes:
      - reports-data:/app/reports
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      reports-init: { condition: service_completed_successfully }
    networks: [private]
    stop_grace_period: 45s
    restart: unless-stopped

  reports-init:
    image: aasp-worker
    user: "0:0"
    command: ["sh", "-c", "chown -R app:app /app/reports"]
    volumes:
      - reports-data:/app/reports
    networks: [private]
    restart: "no"

  fixture:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    command: ["pnpm", "--filter", "@aasp/fixture-web", "start"]
    environment:
      FIXTURE_PORT: 4010
      ASSESSMENT_VERIFICATION_TOKEN: ${FIXTURE_VERIFICATION_TOKEN:-fixture-runtime-token-not-for-production}
    ports:
      - "127.0.0.1:${FIXTURE_PORT:-4010}:4010"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      private:
        aliases: [fixture.internal]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.platform
    command: ["pnpm", "--filter", "@aasp/web", "start"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  reports-data:

networks:
  private:
    name: aasp-private
    driver: bridge
